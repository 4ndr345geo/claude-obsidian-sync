name: Release

# Startet, wenn ein Versions-Tag (z. B. 1.2.0) hochgeladen wird.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tag muss zur Version in manifest.json passen
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag '$TAG' passt nicht zur Version '$VERSION' in manifest.json"
            exit 1
          fi

      - name: Tests
        run: npm test

      - name: Bauen
        run: npm run build

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
